# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/timetracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de CORS dinámica (asigna localhost por defecto si no existe la variable)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Estrategia para confiar en las cabeceras del proxy inverso (Nginx)
server.forward-headers-strategy=framework

# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
# 15 minutes access token expiration
app.jwt.expiration-ms=900000
# 7 days refresh token expiration
app.jwt.refresh-expiration-ms=604800000

